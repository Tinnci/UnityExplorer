name: Build UnityExplorer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dotnet.yml"
      - "build.ps1"
      - "build-configs.ps1"
      - "src/**"
      - "lib/**"
      - "mcp-server/**"
      - "UnityEditorPackage/**"
      - "UniverseLib_src/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dotnet.yml"
      - "build.ps1"
      - "build-configs.ps1"
      - "src/**"
      - "lib/**"
      - "mcp-server/**"
      - "UnityEditorPackage/**"
      - "UniverseLib_src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '-noci')
    concurrency:
      group: unityexplorer-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
          include-prerelease: true

      - name: Build UnityExplorer
        run: ./build.ps1

      - name: Upload BepInEx IL2CPP
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.BepInEx.IL2CPP.zip
          path: ./Release/UnityExplorer.BepInEx.IL2CPP.zip
      
      - name: Upload BepInEx IL2CPP CoreCLR
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.BepInEx.IL2CPP.CoreCLR.zip
          path: ./Release/UnityExplorer.BepInEx.IL2CPP.CoreCLR.zip

      - name: Upload BepInEx Unity IL2CPP CoreCLR
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.BepInEx.Unity.IL2CPP.CoreCLR.zip
          path: ./Release/UnityExplorer.BepInEx.Unity.IL2CPP.CoreCLR.zip

      - name: Upload BepInEx 5 Mono
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.BepInEx5.Mono.zip
          path: ./Release/UnityExplorer.BepInEx5.Mono.zip
      
      - name: Upload BepInEx 6 Mono
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.BepInEx6.Mono.zip
          path: ./Release/UnityExplorer.BepInEx6.Mono.zip

      - name: Upload BepInEx 6 Unity Mono
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.BepInEx6.Unity.Mono.zip
          path: ./Release/UnityExplorer.BepInEx6.Unity.Mono.zip
      
      - name: Upload Editor
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.Editor.zip
          path: ./Release/UnityExplorer.Editor.zip
      
      - name: Upload MelonLoader IL2CPP net6preview
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.MelonLoader.IL2CPP.net6preview.zip
          path: ./Release/UnityExplorer.MelonLoader.IL2CPP.net6preview.zip

      - name: Upload MelonLoader IL2CPP net6preview interop
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.MelonLoader.IL2CPP.net6preview.interop.zip
          path: ./Release/UnityExplorer.MelonLoader.IL2CPP.net6preview.interop.zip

      - name: Upload MelonLoader IL2CPP CoreCLR
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.MelonLoader.IL2CPP.CoreCLR.zip
          path: ./Release/UnityExplorer.MelonLoader.IL2CPP.CoreCLR.zip
      
      - name: Upload MelonLoader IL2CPP
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.MelonLoader.IL2CPP.zip
          path: ./Release/UnityExplorer.MelonLoader.IL2CPP.zip
      
      - name: Upload MelonLoader Mono
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.MelonLoader.Mono.zip
          path: ./Release/UnityExplorer.MelonLoader.Mono.zip
      
      - name: Upload Standalone IL2CPP
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.Standalone.IL2CPP.zip
          path: ./Release/UnityExplorer.Standalone.IL2CPP.zip

      - name: Upload Standalone IL2CPP CoreCLR
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.Standalone.IL2CPP.CoreCLR.zip
          path: ./Release/UnityExplorer.Standalone.IL2CPP.CoreCLR.zip
      
      - name: Upload Standalone Mono
        uses: actions/upload-artifact@v4
        with:
          name: UnityExplorer.Standalone.Mono.zip
          path: ./Release/UnityExplorer.Standalone.Mono.zip
